name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check app
      - run: python -m compileall -q app
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check static/app.js

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t videotools:ci .
      - run: |
          docker run -d --name vt -e APP_PASSWORD=ci -p 8000:8000 videotools:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/me && break; sleep 2; done
          curl -fs http://localhost:8000/api/me
          docker logs vt
