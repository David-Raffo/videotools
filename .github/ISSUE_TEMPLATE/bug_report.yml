name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a video...
        2. Apply...
        3. Export...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: environment
    attributes:
      label: Server environment
      description: Docker version, host OS, GPU (if any) and relevant settings from `.env`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs videotools`.
      render: text
